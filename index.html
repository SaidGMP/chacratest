<!DOCTYPE html>
<!-- AI-assisted: drafted with Claude (Anthropic); reviewed, run and edited by the team. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChacraTest – crop rotation stress-test, Carumas (Moquegua)</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--mut:#5b6475;--card:#f3f5f9;--ac:#1d2c85;--bad:#d4452b;--ok:#2b8a57;--bd:#d5dae3}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--fg:#e6e9f2;--mut:#9aa3b7;--card:#1a1f2d;--ac:#8fa2ff;--bad:#ff7a5c;--ok:#5fd193;--bd:#2c3446}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Arial,sans-serif;max-width:900px;margin:auto}
h1{font-size:1.5rem;margin:.2em 0;display:inline-block}h2{font-size:1.1rem;margin:1.4em 0 .4em;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.warn{border-left:4px solid var(--bad)}.conc{border-left:4px solid var(--ok)}small,.mut{color:var(--mut)}
label{display:block;margin:6px 0}input[type=range]{width:100%}input[type=text],select{padding:4px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
table{border-collapse:collapse;width:100%}th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92rem}
.wrap{overflow-x:auto}.best{outline:2px solid var(--ok)}.num{font-variant-numeric:tabular-nums}
#lang{float:right;padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
#explain,#speak{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<button id="lang">ES</button>
<h1>ChacraTest</h1>
<p data-t="intro"></p>
<div class="card warn" data-t="warn"></div>

<h2 data-t="h1"></h2>
<div class="card"><svg id="chart" viewBox="0 0 700 190" width="100%" role="img"></svg><small id="chartnote"></small></div>

<h2 data-t="h10"></h2>
<div class="card wrap">
<label><span data-t="lC"></span> <b id="vC">5</b> <input id="cyc" type="range" min="2" max="8" value="5"></label>
<label><span data-t="lL"></span> <select id="flv"><option value="d0">≤ 0 °C</option><option value="d2" selected>≤ −2 °C</option><option value="d4">≤ −4 °C</option></select></label>
<label><span data-t="lNd"></span> <input id="need" type="number" min="0" step="10" style="width:7em"></label>
<div id="plan"></div><small data-t="pnote"></small></div>
<h2 data-t="h2"></h2>
<div class="card">
<label><span data-t="lD"></span> <b id="vD">25</b> <input id="pD" type="range" min="5" max="40" value="25"></label>
<label><span data-t="lV"></span> <b id="vV">10</b> <input id="pV" type="range" min="2" max="25" value="10"></label>
<label><span data-t="lF"></span> <b id="vF">75</b> <span data-t="lF2"></span> <input id="pF" type="range" min="50" max="95" value="75"></label>
<small id="thr"></small></div>

<h2 data-t="h3"></h2>
<div class="card wrap"><table id="crops"></table><small data-t="cnote"></small></div>

<h2 data-t="h4"></h2>
<div class="card"><label><span data-t="lW"></span> <b id="vW">40</b><span data-t="lW2"></span> <input id="w" type="range" min="0" max="100" value="40"></label><small data-t="snote"></small></div>

<h2 data-t="h5"></h2>
<div id="res"></div>
<div class="card conc" id="conc"></div>
<div class="card"><button id="explain" data-t="bx"></button> <button id="speak" data-t="bs"></button><div id="xp" style="margin-top:8px"></div></div>
<h2 data-t="h9"></h2>
<div class="card"><label><span data-t="lI"></span> <input id="inv" type="number" min="0" step="100" style="width:8em"></label><div id="fin"></div><small data-t="fnote"></small></div>

<h2 data-t="h6"></h2>
<div class="card">
<label><span data-t="lN"></span><br><input id="nino" type="text" style="width:100%" placeholder="1991, 1997, 2002 …"></label>

<h2 data-t="h7"></h2>
<div class="card wrap" id="mon"></div>

const t=k=>L[lang][k],$=id=>document.getElementById(id);
function q(a,p){const s=[...a].sort((x,y)=>x-y),pos=(s.length-1)*p,lo=Math.floor(pos),hi=Math.ceil(pos);return s[lo]+(s[hi]-s[lo])*(pos-lo)}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const u=1/(1+.3275911*x);return s*(1-(((((1.061405429*u-1.453152027)*u)+1.421413741)*u-.284496736)*u+.254829592)*u*Math.exp(-x*x))}
function mwu(a,b){const all=[...a.map(v=>({v,g:0})),...b.map(v=>({v,g:1}))].sort((x,y)=>x.v-y.v),N=all.length;let i=0,tie=0;
 while(i<N){let j=i;while(j+1<N&&all[j+1].v===all[i].v)j++;const r=(i+j)/2+1;for(let k=i;k<=j;k++)all[k].r=r;const c=j-i+1;tie+=c*c*c-c;i=j+1}
 const n1=a.length,n2=b.length,R1=all.filter(x=>x.g===0).reduce((s,x)=>s+x.r,0),U=R1-n1*(n1+1)/2,mu=n1*n2/2,sg=Math.sqrt(n1*n2/12*((N+1)-tie/(N*(N-1)))),z=(Math.abs(U-mu)-.5)/sg;
 return{U,p:Math.max(0,Math.min(1,2*(1-.5*(1+erf(z/Math.SQRT2)))))}}
function wilson(p,n){const z=1.96,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h),Math.min(1,c+h)]}
function rname(R){const nm=R.s.map(k=>CROPS[k].n[lang]);return nm.every(x=>x===nm[0])?`${nm[0]} × 3 ${t('ref')}`:nm.join(' → ')}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));$('lang').textContent=t('btn');buildCrops();run();planner()}
function buildCrops(){let h=`<tr><th>${t('crop')}</th><th>${t('cf')}</th><th>${t('cf2')}</th></tr>`;
 for(const k in CROPS){const c=CROPS[k];h+=`<tr><td>${c.n[lang]}</td><td><select data-k="${k}" data-f="dry">${['dry','vdry'].map(v=>`<option value="${v}"${c.dry===v?' selected':''}>${t(v)}</option>`).join('')}</select></td><td><select data-k="${k}" data-f="fr">${Object.keys(FL).map(f=>`<option value="${f}"${c.fr===f?' selected':''}>${FL[f]}</option>`).join('')}</select></td></tr>`}
 $('crops').innerHTML=h;$('crops').querySelectorAll('select').forEach(s=>s.onchange=e=>{CROPS[e.target.dataset.k][e.target.dataset.f]=e.target.value;run()})}
function run(){
 const pD=+$('pD').value,pV=+$('pV').value,pF=+$('pF').value,w=+$('w').value/100;
 $('vD').textContent=pD;$('vV').textContent=pV;$('vF').textContent=pF;$('vW').textContent=Math.round(w*100);
 const rain=D.map(r=>r.rain),tD=q(rain,pD/100),tV=q(rain,pV/100),tf={};
 for(const k of['d0','d2','d4'])tf[k]=Math.max(1,q(D.map(r=>r[k]),pF/100));
 $('thr').textContent=t('thr')(tD.toFixed(0),tV.toFixed(0),`${tf.d0} (≤0 °C), ${tf.d2} (≤−2 °C), ${tf.d4} (≤−4 °C)`);
 const W=700,H=150,bw=W/D.length,mx=Math.max(...rain);let s='';
 D.forEach((r,i)=>{const h=r.rain/mx*H;s+=`<rect x="${i*bw+1}" y="${H-h+10}" width="${bw-2}" height="${h}" fill="${r.rain<=tV?'var(--bad)':r.rain<=tD?'#e0a030':'var(--ac)'}"><title>${r.y}: ${r.rain} mm</title></rect>`});
 [[tD,t('dry')],[tV,t('vdry')]].forEach(([v,l])=>{const y=H-v/mx*H+10;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-dasharray="4 3"/><text x="4" y="${y-3}" font-size="10" fill="var(--fg)">${l}</text>`});
 s+=`<text x="0" y="185" font-size="10" fill="var(--mut)">${D[0].y}</text><text x="${W-26}" y="185" font-size="10" fill="var(--mut)">${D[D.length-1].y}</text>`;
 $('chart').innerHTML=s;$('chartnote').textContent=t('cn')(rain.filter(v=>v<=tD).length);
 const fail=(k,r)=>{const c=CROPS[k];return (c.dry==='dry'?r.rain<=tD:r.rain<=tV)||r[c.fr]>=tf[c.fr]};
 const base=ROT.map(R=>{let nw=0,wf=0,tfail=0,mx=0;for(let i=0;i+2<D.length;i++){let f=0;R.s.forEach((k,j)=>{if(fail(k,D[i+j]))f++});nw++;if(f)wf++;tfail+=f;mx=Math.max(mx,f)}
  let soil=0;R.s.forEach((k,j)=>{if(CROPS[k].leg)soil++;if(j&&R.s[j-1]===k)soil--});
  const rate=tfail/(3*nw);return{R,nw,wf,rate,mx,soil,sn:Math.max(0,Math.min(100,(soil+2)/3*100)),ci:wilson(rate,D.length)}});
 const sc=(o,x)=>(1-x)*100*(1-o.rate)+x*o.sn;
 const out=base.map(o=>({...o,score:sc(o,w)})).sort((a,b)=>b.score-a.score);
 const byRate=[...base].sort((a,b)=>a.rate-b.rate).map(o=>o.R.id),dot=id=>{const i=byRate.indexOf(id);return i===0?'🟢':i===byRate.length-1?'🔴':'🟡'};
 $('res').innerHTML=`<div class="card wrap"><table><tr><th>${t('rotc')}</th><th>${t('w1')}</th><th>${t('w2')}</th><th>${t('w3')}</th><th>${t('w4')}</th></tr>${out.map((o,i)=>`<tr class="${i?'':'best'}"><td>${dot(o.R.id)} ${o.R.id}. ${rname(o.R)}</td><td class="num">${o.wf} / ${o.nw} (${Math.round(o.wf/o.nw*100)}%)</td><td class="num">${(o.rate*100).toFixed(0)}% (${(o.ci[0]*100).toFixed(0)}–${(o.ci[1]*100).toFixed(0)}%)</td><td class="num">${o.soil>0?'+':''}${o.soil}</td><td class="num"><b>${o.score.toFixed(0)}</b></td></tr>`).join('')}</table></div>
 <div class="card">${t('plain')(out[0].R.id+' ('+rname(out[0].R)+')',out[0].wf,out[0].nw)}</div>`;
 const segs=[];let prev=null;for(let x=0;x<=100;x++){const b=[...base].sort((p,q2)=>sc(q2,x/100)-sc(p,x/100))[0].R.id;if(b!==prev){segs.push({id:b,a:x});prev=b}}
 $('conc').innerHTML=t('conc')(segs.map((g,i)=>t('seg')(g.a,i+1<segs.length?segs[i+1].a-1:100,g.R||`${g.id}. ${rname(ROT.find(r=>r.id===g.id))}`)).join('; '));
 const inv=+$('inv').value;$('fin').innerHTML=inv>0?base.map(o=>t('ft')(o.R.id,rname(o.R),(o.rate*3).toFixed(1),Math.round(inv*o.rate*3).toLocaleString(),(inv*3).toLocaleString(),o.mx,(inv*o.mx).toLocaleString())).join('<br>'):'';
 const bst=out[0],xl=[...new Set(bst.R.s)].map(k=>{const c=CROPS[k];let wc=0,fc=0,ea=0;D.forEach(r=>{const a=c.dry==='dry'?r.rain<=tD:r.rain<=tV,b=r[c.fr]>=tf[c.fr];if(a)wc++;if(b)fc++;if(a||b)ea++});return t('xl')(c.n[lang],ea,D.length,wc,fc)}),dr=[...D].sort((a,b)=>a.rain-b.rain).slice(0,3).map(r=>r.y).join(', ');
 XP=[t('x1')(rname(bst.R)),...xl,t('x2')(dr),bst.soil>0?t('xs1'):bst.soil<0?t('xs2'):t('xs0'),t('x3')].join(' ');if(XO)$('xp').textContent=XP;
 const ys=new Set($('nino').value.split(/[^0-9]+/).filter(Boolean).map(Number)),a=D.filter(r=>ys.has(r.y)).map(r=>r.rain),b=D.filter(r=>!ys.has(r.y)).map(r=>r.rain);
 if(a.length<3||b.length<3)$('nres').textContent=t('nl');else{const m=mwu(a,b);$('nres').textContent=t('nr')(a.length,q(a,.5).toFixed(0),b.length,q(b,.5).toFixed(0),m.U.toFixed(1),+m.p.toFixed(3))}
 if(!MON)$('mon').innerHTML=`<small>${t('mnone')}</small>`;else $('mon').innerHTML=`<table><tr>${t('mh').map(x=>`<th>${x}</th>`).join('')}</tr>${[10,11,12,1,2,3,4].map(m=>{const r=MON[m];return r?`<tr><td>${t('mn')[m]}</td><td class="num">${r.rain_mean}</td><td class="num">${r.rain_p10}–${r.rain_p90}</td><td class="num">${r.d2_mean}</td></tr>`:''}).join('')}</table>`;
}
function planner(){
 const L0=+$('cyc').value,lv=$('flv').value,need=+$('need').value||0;$('vC').textContent=L0;
 if(!SER){$('plan').innerHTML=`<small>${t('pnone')}</small>`;return}
 const ys=Object.keys(SER).map(Number).sort((a,b)=>a-b),ix=lv==='d0'?1:lv==='d2'?2:3;let rows='';
 for(let k=0;k<12;k++){const m0=(9+k)%12,cum=[],fr=[];
  ys.forEach(y=>{let rs=0,fs=0,ok=true;for(let j=0;j<L0;j++){const mi=m0+j,a=SER[y+Math.floor(mi/12)]&&SER[y+Math.floor(mi/12)][mi%12];if(!a){ok=false;break}rs+=a[0];fs+=a[ix]}if(ok){cum.push(rs);fr.push(fs)}});
  const n=cum.length;if(!n)continue;const pf=fr.filter(v=>v>=1).length/n,ci=wilson(pf,n);
  rows+=`<tr><td>${t('mn')[m0+1]}</td><td class="num">${n}</td><td class="num">${q(cum,.5).toFixed(0)}</td><td class="num">${q(cum,.1).toFixed(0)}–${q(cum,.9).toFixed(0)}</td><td class="num">${(pf*100).toFixed(0)}% (${(ci[0]*100).toFixed(0)}–${(ci[1]*100).toFixed(0)}%)</td>${need?`<td class="num">${(cum.filter(v=>v<need).length/n*100).toFixed(0)}%</td>`:''}</tr>`}
 $('plan').innerHTML=`<table><tr>${t('ph').map(x=>`<th>${x}</th>`).join('')}${need?`<th>${t('pw')}</th>`:''}</tr>${rows}</table>`}
['cyc','flv','need'].forEach(id=>$(id).oninput=planner);
['pD','pV','pF','w','nino'].forEach(id=>$(id).oninput=run);
$('explain').onclick=()=>{XO=!XO;$('xp').textContent=XO?XP:''};
$('speak').onclick=()=>{if(!('speechSynthesis' in window)){alert(t('nosp'));return}const sy=window.speechSynthesis;
 if(TK){sy.cancel();TK=false;return}
 sy.cancel();XO=true;$('xp').textContent=XP;
 const pre=lang==='es'?'es':'en',vs=sy.getVoices(),vo=vs.find(v=>v.lang.toLowerCase().startsWith(pre+'-pe'))||vs.find(v=>v.lang.toLowerCase().startsWith(pre))||null,parts=XP.match(/[^.!?]+[.!?]*/g)||[XP];
 TK=true;
 parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x.trim());if(vo){u.voice=vo;u.lang=vo.lang}else u.lang=lang==='es'?'es-ES':'en-US';u.rate=.95;if(i===parts.length-1){u.onend=u.onerror=()=>{TK=false}}sy.speak(u)});
 setTimeout(()=>{if(TK&&!sy.speaking&&!sy.pending){TK=false;$('xp').textContent=XP+' '+t('nov')}},1500)};
$('lang').onclick=()=>{lang=lang==='en'?'es':'en';apply()};
fetch('monthly.json').then(r=>r.ok?r.json():null).then(j=>{if(j){MON=j;run()}}).catch(()=>{});
fetch('monthly_series.json').then(r=>r.ok?r.json():null).then(j=>{if(j){SER=j;planner()}}).catch(()=>{});
apply();
</script>
